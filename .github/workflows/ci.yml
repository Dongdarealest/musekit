name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the importer tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the importer on the fixture
        run: |
          python importer/musekit_import.py tests/fixtures/claude-skill --output-dir /tmp/musekit-smoke
          test -f /tmp/musekit-smoke/demo_skill/SKILL.md
          test -f /tmp/musekit-smoke/demo_skill/skill.yaml
